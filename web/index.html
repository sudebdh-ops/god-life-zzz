<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176c52">
  <meta name="description" content="작은 실천을 쌓는 우리만의 루틴 앱, god life zzz">
  <title>god life zzz</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="app.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="#today" class="brand"><img src="icons/icon.svg" alt="" width="40" height="40"><span>god life zzz<small>작은 실천, 좋은 하루</small></span></a>
      <nav aria-label="주 메뉴">
        <button class="nav-button active" data-tab="today" aria-current="page"><span aria-hidden="true">☀</span>오늘</button>
        <button class="nav-button" data-tab="routines"><span aria-hidden="true">≡</span>내 루틴</button>
        <button class="nav-button" data-tab="settings"><span aria-hidden="true">⚙</span>설정</button>
      </nav>
      <div class="sidebar-note"><span class="seed" aria-hidden="true">✳</span><p>어제보다 조금만.<br>그것도 충분한 갓생.</p><small>v0.2.0 · 친구와 함께</small></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><span id="date-label"></span><div class="topbar-actions"><span class="mode-badge" id="mode-badge">크롬 버전</span><button class="button primary compact" id="top-add">＋ 루틴 추가</button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer>나만의 속도로, 오늘도 god life zzz</footer>
    </div>
  </div>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="routine-form">
      <div class="dialog-header"><div><span class="eyebrow">MY ROUTINE</span><h2 id="editor-title">새 루틴 만들기</h2></div><button type="button" class="icon-button" id="close-editor" aria-label="닫기">×</button></div>
      <p class="muted">꾸준히 할 수 있는 만큼, 작게 시작해보세요.</p>
      <label class="field">루틴 이름<input id="title" name="title" maxlength="80" required placeholder="예: 저녁에 20분 산책하기" autocomplete="off"></label>
      <label class="field">메모 <span class="optional">선택</span><textarea id="note" name="note" maxlength="500" rows="3" placeholder="나만의 방법이나 목표를 적어주세요"></textarea></label>
      <fieldset><legend>반복 요일</legend><div class="day-picker" id="days"></div><div class="day-presets"><button type="button" data-preset="daily">매일</button><button type="button" data-preset="weekdays">평일</button><button type="button" data-preset="weekend">주말</button></div></fieldset>
      <div class="reminder-row"><div><label for="reminder">리마인더 알림</label><p class="muted small">선택한 요일에 알려드려요</p></div><input type="checkbox" id="reminder" class="switch" checked></div>
      <label class="field" id="time-field">알림 시간<input type="time" id="time" value="08:00" required></label>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="button secondary" id="cancel-editor">취소</button><button type="submit" class="button primary">저장하기</button></div>
    </form>
  </dialog>

  <dialog id="confirm" aria-labelledby="confirm-title"><div class="confirm-body"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button class="button secondary" id="confirm-cancel">취소</button><button class="button primary" id="confirm-ok">확인</button></div></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>이 앱을 사용하려면 JavaScript를 허용해주세요.</noscript>
</body>
</html>
